<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travis Interpreter</title>
    <!--
      Hidden window that hosts the Pyodide Python runtime. The main app
      sends `run-python-request` events here; this window executes the
      requested code in a sandboxed WASM Python interpreter and emits
      `run-python-result` back.

      Started at app launch (visible: false in tauri.conf.json) so
      Pyodide is warm by the time the user triggers their first code
      run. Window dimensions are 1x1 and positioned off-screen as
      belt-and-braces.
    -->
  </head>
  <body style="background:#07080b; color:#ececf1; font-family:monospace; font-size:10px; margin:0; padding:4px; overflow:hidden;">
    <div id="interp-root"></div>
    <script type="module" src="/src/interpreter/main.tsx"></script>
  </body>
</html>
