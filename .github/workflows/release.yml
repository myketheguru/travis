# Two-repo release pipeline.
#
# THIS repo (private)               PUBLIC_REPO (public, see env below)
# ─────────────────────             ────────────────────────────────────
# - source code                     - installer assets only
# - build secrets                   - latest.json (updater manifest)
# - tag pushes trigger this         - what end users actually download from
#
# Triggered when you push a tag matching v* (e.g. v0.2.0). The pipeline
# runs in two stages:
#
#   1. build-and-stage  (Win/Mac/Linux, in parallel)
#      Builds Travis, signs each installer with the Tauri Ed25519 key,
#      attaches everything to a DRAFT release in this PRIVATE repo. The
#      draft accumulates assets across platforms and tauri-action
#      regenerates latest.json after each upload.
#
#   2. promote-public   (single linux runner, after #1 finishes)
#      Downloads everything from the private staging draft and creates a
#      DRAFT release in the public repo with the same tag. You then
#      review + publish the PUBLIC release manually — that's the moment
#      auto-updates go live for end users.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#
#   Required for cross-repo publishing:
#     RELEASES_REPO_PAT                   — fine-grained PAT, scoped only to
#                                           PUBLIC_REPO, with "Contents: Read
#                                           and write" permission
#
#   Required for signed releases:
#     TAURI_SIGNING_PRIVATE_KEY           — output of `tauri signer generate`
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — password chosen at keygen time
#
#   Required for OAuth + telemetry (else those features are disabled at runtime):
#     TRAVIS_GOOGLE_CLIENT_ID
#     TRAVIS_GOOGLE_CLIENT_SECRET
#     TRAVIS_MICROSOFT_CLIENT_ID
#     TRAVIS_MICROSOFT_CLIENT_SECRET
#     TRAVIS_TELEMETRY_URL
#     TRAVIS_TELEMETRY_TOKEN

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Change this to your own org/repo if you fork. PUBLIC_REPO must be a
# public GitHub repo that the RELEASES_REPO_PAT has Contents:write on.
env:
  PUBLIC_REPO: myketheguru/travis-releases

jobs:
  build-and-stage:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (with macOS targets when needed)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Build, sign, append to staging draft (this private repo)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TRAVIS_GOOGLE_CLIENT_ID: ${{ secrets.TRAVIS_GOOGLE_CLIENT_ID }}
          TRAVIS_GOOGLE_CLIENT_SECRET: ${{ secrets.TRAVIS_GOOGLE_CLIENT_SECRET }}
          TRAVIS_MICROSOFT_CLIENT_ID: ${{ secrets.TRAVIS_MICROSOFT_CLIENT_ID }}
          TRAVIS_MICROSOFT_CLIENT_SECRET: ${{ secrets.TRAVIS_MICROSOFT_CLIENT_SECRET }}
          TRAVIS_TELEMETRY_URL: ${{ secrets.TRAVIS_TELEMETRY_URL }}
          TRAVIS_TELEMETRY_TOKEN: ${{ secrets.TRAVIS_TELEMETRY_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Travis ${{ github.ref_name }} (staging)'
          releaseBody: |
            Internal staging draft for ${{ github.ref_name }}.
            The user-facing release is at github.com/${{ env.PUBLIC_REPO }}/releases.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

  promote-public:
    needs: build-and-stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download staged assets from this private repo
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded assets
        run: ls -la assets/

      - name: Create or update draft release in public repo
        run: |
          # Idempotent: re-running the workflow on the same tag updates
          # assets in place rather than failing.
          if gh release view "${{ github.ref_name }}" \
               --repo "${{ env.PUBLIC_REPO }}" >/dev/null 2>&1; then
            echo "Release exists; uploading assets with --clobber"
            gh release upload "${{ github.ref_name }}" assets/* \
              --repo "${{ env.PUBLIC_REPO }}" \
              --clobber
          else
            echo "Creating new draft release"
            gh release create "${{ github.ref_name }}" assets/* \
              --repo "${{ env.PUBLIC_REPO }}" \
              --title "Travis ${{ github.ref_name }}" \
              --notes "Auto-built. Edit these notes before publishing." \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
