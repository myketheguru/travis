# Lightweight CI: typecheck + cargo check on every push and PR.
# Runs on Linux only — full multi-platform builds are reserved for the
# release pipeline (which fires on tag push). OAuth/telemetry env vars
# are intentionally NOT set here; build.rs falls through gracefully when
# they're absent.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo check
        working-directory: src-tauri
        run: cargo check
