# v0.28.62 — statically link the C runtime on Windows so the shipped
# binary doesn't need MSVCP140.dll / VCRUNTIME140.dll from the user's
# machine. Fresh Windows 11 installs don't have them, so the app
# failed to start with "MSVCP140.dll was not found" until the user
# manually installed the VC++ 2015-2022 redistributable.
#
# This side of the fix handles Rust code. The other side is the CI
# env vars (CMAKE_MSVC_RUNTIME_LIBRARY / CFLAGS / CXXFLAGS) which
# propagate the same choice into whisper.cpp's cmake build so the
# whole binary is consistent.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
