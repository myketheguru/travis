[package]
name = "travis"
version = "0.16.5"
description = "Travis — local-first AI operations assistant"
authors = ["myketheguru"]
edition = "2021"

[lib]
name = "travis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default builds bundle every shipped pack. Users pick which packs to
# enable at runtime via onboarding or Settings → Packs (toggling
# writes `meta.pack.<slug>.enabled`). The Cargo features themselves
# are kept as a build-time lever for distros / contributors who want
# to ship narrow binaries — e.g. `--no-default-features --features
# pack-tutoring` for a tutoring-only build.
default = ["pack-lead-to-empower", "pack-tutoring"]
pack-lead-to-empower = []
pack-tutoring        = []

[build-dependencies]
tauri-build = { version = "~2.5", features = [] }

[dependencies]
# All tauri/plugin crates pinned to ~2.10 (matching the JS @tauri-apps/api
# 2.10.1 in package.json) so Tauri's mandatory same-major.minor preflight
# check passes. Lift when we coordinate the whole-stack jump to 2.11.
tauri = { version = "~2.10", features = ["tray-icon", "macos-private-api"] }
# tauri-runtime / wry are loose transitive deps from tauri itself.
# Without explicit pins, cargo lifts them to 2.11.x and breaks the
# tauri 2.10.x crate compile (trait Send vs Send + Sync mismatch).
tauri-runtime = "~2.10"
tauri-runtime-wry = "~2.10"
tauri-plugin-opener = "~2.5"
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-notification = "~2.3"
tauri-plugin-updater = "~2.10"
tauri-plugin-clipboard-manager = "~2.3"
# Pinned to 2.4.x so it matches the JS @tauri-apps/plugin-dialog 2.4.2
# in package.json. 2.5+ pulls in tauri 2.11 which isn't on crates.io in
# the version we use yet. See CHANGELOG v0.13.4.
tauri-plugin-dialog = "~2.4"
oauth2 = "5"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastembed = "4"
printpdf = "0.7"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
base64 = "0.22"
sha2 = "0.10"
pdf-extract = "0.7"
calamine = "0.26"
csv = "1"
