[package]
name = "travis"
version = "0.28.75"
description = "Travis — local-first AI operations assistant"
authors = ["myketheguru"]
edition = "2021"

[lib]
name = "travis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default builds bundle every shipped pack. Users pick which packs to
# enable at runtime via onboarding or Settings → Packs (toggling
# writes `meta.pack.<slug>.enabled`). The Cargo features themselves
# are kept as a build-time lever for distros / contributors who want
# to ship narrow binaries — e.g. `--no-default-features --features
# pack-tutoring` for a tutoring-only build.
default = ["pack-lead-to-empower", "pack-tutoring", "pack-everyday"]
pack-lead-to-empower = []
pack-tutoring        = []
pack-everyday        = []

[build-dependencies]
tauri-build = { version = "~2.5", features = [] }

[dependencies]
# All tauri/plugin crates pinned to ~2.10 (matching the JS @tauri-apps/api
# 2.10.1 in package.json) so Tauri's mandatory same-major.minor preflight
# check passes. Lift when we coordinate the whole-stack jump to 2.11.
tauri = { version = "~2.10", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
# tauri-runtime / wry are loose transitive deps from tauri itself.
# Without explicit pins, cargo lifts them to 2.11.x and breaks the
# tauri 2.10.x crate compile (trait Send vs Send + Sync mismatch).
tauri-runtime = "~2.10"
tauri-runtime-wry = "~2.10"
tauri-plugin-opener = "~2.5"
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-notification = "~2.3"
tauri-plugin-updater = "~2.10"
tauri-plugin-clipboard-manager = "~2.3"
# Pinned to 2.4.x so it matches the JS @tauri-apps/plugin-dialog 2.4.2
# in package.json. 2.5+ pulls in tauri 2.11 which isn't on crates.io in
# the version we use yet. See CHANGELOG v0.13.4.
tauri-plugin-dialog = "~2.4"
# v0.22.2 — register travis:// URL scheme on all platforms so the web
# dashboard can open the desktop app + trigger update checks via deep
# links like travis://open and travis://update.
tauri-plugin-deep-link = "~2.4"
oauth2 = "5"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# v0.22.10 — lazy Python runtime bootstrap. Downloads + extracts the
# CPython tarball to a per-user cache when the user first touches a
# code-execution feature. tar/flate2 unpack on POSIX + Windows from
# the same tarball stream.
tar = "0.4"
flate2 = "1"
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastembed = "4"
printpdf = "0.7"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
base64 = "0.22"
sha2 = "0.10"
pdf-extract = "0.7"
calamine = "0.26"
csv = "1"
urlencoding = "2"
# v0.22.12 — speech-to-text via whisper.cpp. Rust bindings pull in
# the C++ code + build it at first compile (adds ~2min to a fresh
# cargo build; incremental is cached). Runs entirely local, offline,
# no API cost. Models download lazily via the same bootstrap pattern
# as the Python runtime — user sees the sleek loader.
whisper-rs = { version = "0.16", default-features = false }
# v0.28 — native mic capture (kills the WebView AudioContext dance).
# cpal talks directly to WASAPI on Windows, CoreAudio on macOS, ALSA
# on Linux. Lower latency, no permission prompts per WebView, no
# suspended-context bugs, respects the OS's chosen input device.
cpal = "0.15"
# v0.24 task 314 — Travis-to-Travis peer discovery via multicast DNS.
# Pure Rust; works across macOS, Windows, Linux. Advertises Travis's
# presence on the LAN + browses for other Travises so users don't need
# to email invitations for people in the same room.
mdns-sd = { version = "0.11", default-features = false, features = ["async"] }
# v0.24 task 315 — Sentry Phase 2. Cross-platform foreground-window
# capture: title + app name + PID. Used by the opt-in Sentry mode
# to give Travis a rough sense of what the user is working on
# throughout the day. Only runs when consent is on locally AND cloud
# side confirms; every event is batched to /me/telemetry/ingest.
active-win-pos-rs = "0.9"
# v0.28.19 — WAV encoding for the voice-utterance audio artifact.
# Every intent capture writes a small mono 16kHz WAV so the message
# can render an audio player next to the transcript.
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
# v0.28.51 — Bluetooth LE (task #379). Central role (scan) is real
# and cross-platform via btleplug's per-OS backends (BlueZ / CoreBT /
# WinRT). Peripheral role (advertise) is not shipped yet — btleplug
# doesn't cover it cross-platform, so peer discovery works one-way
# until v0.28.52 pairs this with a peripheral crate. Linux CI needs
# libdbus-1-dev; macOS bundle needs NSBluetoothAlwaysUsageDescription;
# Windows uses WinRT and needs no extra manifest.
btleplug = "0.11"
# v0.28.52 — Sentry Phase 3. Cross-platform screenshot capture via
# xcap (Windows: GDI, macOS: CoreGraphics, Linux X11: xcb, Linux
# Wayland: falls back gracefully). `image` handles JPEG encoding
# + resizing so we don't ship 4K PNGs to R2.
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# v0.28.58 — pure-Rust ONNX runtime for the openWakeWord model chain
# (melspec → embedding → hey_jarvis). We use tract instead of the
# `ort` crate specifically because tract is pure Rust — no native
# onnxruntime binary to bundle per-OS, no CI dep chain to babysit,
# and the wake models are small enough that inference speed is not
# the bottleneck. Runs a hair slower than ORT; on a wake-word chain
# that's ~1ms every 80ms, well below audible latency.
tract-onnx = { version = "0.21", default-features = false }
circular-buffer = "1"

# v0.28.53 — T2T secure file transfer. X25519 for ECDH, HKDF-SHA256 for
# session-key derivation, ChaCha20-Poly1305 as the AEAD, zeroize to
# scrub secrets on drop. All pure-Rust, no OS deps.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex = "0.4"

# v0.28.59 — enable Metal on Apple Silicon (per Gemini). Cargo merges
# features across the base dep + this target-conditional block, so on
# macOS we get whisper.cpp's Metal backend and elsewhere stay CPU-only.
# CUDA/Vulkan are deliberately off — CI would need the toolkits and we
# haven't provisioned that yet.
#
# KEEP THIS AT THE END OF THE FILE. `[target.…]` is its own top-level
# table; anything after this line lives in that target table too, not
# in `[dependencies]`, which silently loses the deps on non-macOS.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
